# Fly.io deploy template — fill in app name, then: fly launch / fly deploy
# Docs: docs/DEPLOY.md

app = "roofvision-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "production"
  STORAGE_BACKEND = "local"
  # Set secrets via: fly secrets set DATABASE_URL=... IMAGE_GEN_API_KEY=...

[http_service]
  internal_port = 8001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/api/v1/health/ready"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
